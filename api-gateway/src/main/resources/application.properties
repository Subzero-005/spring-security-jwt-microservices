spring.application.name=api-gateway
server.port=8080


# Spring Cloud Gateway Routes

spring.cloud.gateway.routes[0].id=user
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/user,/user/**


spring.cloud.gateway.routes[1].id=admin
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/admin,/admin/**


# Auth route
spring.cloud.gateway.routes[2].id=auth
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/auth/**

spring.cloud.gateway.default-filters[0]=PreserveHostHeader

# OAuth2 Resource Server (JWT)

jwt.secret=my-secret-key-my-secret-key-my-secret-key

logging.level.org.springframework.cloud.gateway=DEBUG
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true